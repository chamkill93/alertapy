name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, mbstring, pdo_sqlite, xml
          tools: composer:v2
          coverage: none
      - name: Validate dependency lock
        run: composer validate --strict --no-check-publish
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Test application
        run: composer test
      - name: Test map interactions
        run: |
          node --check public/js/alertapy-icons.js
          node --check public/js/alertapy-map.js
          node --test tests/Frontend/*Test.cjs
      - name: Validate deployment scripts
        run: bash -n scripts/deploy-hostinger.sh scripts/run-cycle.sh

  mysql:
    name: MySQL migration smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: alertapy_test
          MYSQL_USER: alertapy_test
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: alertapy_test
      DB_USERNAME: alertapy_test
      DB_PASSWORD: ci-only-password
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, mbstring, pdo_mysql, xml
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Migrate, seed twice, and cache application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --seed --force --no-interaction
          php artisan db:seed --force --no-interaction
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan alertapy:status
